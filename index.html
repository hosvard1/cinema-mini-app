<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cinema</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        CINEMA
    </div>

    <div class="user">
        👤
        <span id="username">User</span>
    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-content">

            <span class="badge">
                NOW SHOWING
            </span>

            <h1>Avatar</h1>

            <p>
                Experience the movie on the big screen.
            </p>

            <button onclick="openMovie()">
                Buy Ticket
            </button>

        </div>

    </section>


    <section class="movies">

        <h2>Movies</h2>

        <div class="movie-card">

            <img
                src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
                alt="Cinema"
            >

            <div class="movie-info">

                <h3>Avatar</h3>

                <p>Action · Adventure · Sci-Fi</p>

                <div class="sessions">

                    <button onclick="selectSession('18:00')">
                        18:00
                    </button>

                    <button onclick="selectSession('20:30')">
                        20:30
                    </button>

                    <button onclick="selectSession('23:00')">
                        23:00
                    </button>

                </div>

            </div>

        </div>

    </section>


    <section
        id="seats-section"
        class="seats-section hidden"
    >

        <h2>Select your seats</h2>

        <div class="screen">
            SCREEN
        </div>

        <div id="seats" class="seats"></div>

        <div class="summary">

            <p>
                Seats:
                <strong id="selected-seats">—</strong>
            </p>

            <p>
                Total:
                <strong id="total">0 ⭐</strong>
            </p>

            <button
                id="pay-button"
                onclick="pay()"
                disabled
            >
                ⭐ Pay
            </button>

        </div>

    </section>

</main>


<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="script.js"></script>

</body>
</html>
